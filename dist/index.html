<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12243a">
  <meta name="description" content="BancoDoc: documentos de empresas organizados a partir das pastas compartilhadas no Google Drive.">
  <title>BancoDoc</title>
  <link rel="stylesheet" href="./style.css">
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <script defer src="./app.js"></script>
  <script defer src="./notifications.js"></script>
  <script defer src="./verification.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><span>BD</span></div>
        <div class="brand-copy"><strong>BancoDoc</strong><span>GESTÃO DOCUMENTAL</span></div>
      </div>
      <div class="workspace-label">ESPAÇO DE TRABALHO</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Visão geral</span></button>
        <button class="nav-item" data-page="companies"><span class="nav-icon" data-icon="building"></span><span>Empresas</span><span class="nav-count" id="company-count">0</span></button>
        <button class="nav-item" data-page="employees"><span class="nav-icon" data-icon="users"></span><span>Colaboradores</span></button>
        <button class="nav-item" data-page="documents"><span class="nav-icon" data-icon="file"></span><span>Documentos</span><span class="nav-dot" id="document-alert-dot"></span></button>
        <button class="nav-item" data-page="contracts"><span class="nav-icon" data-icon="contract"></span><span>Contratos</span></button>
        <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>Relatórios</span></button>
        <button class="nav-item" data-page="notifications"><span class="nav-icon" data-icon="mail"></span><span>Notificações</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="drive-card" id="sidebar-drive-card">
        <div class="drive-card-icon"><span data-icon="cloud"></span></div>
        <div><strong id="sidebar-drive-title">Drive desconectado</strong><p id="sidebar-drive-copy">Conecte sua conta para salvar os arquivos.</p></div>
        <button class="drive-card-action" data-action="open-settings" aria-label="Abrir configurações"><span data-icon="arrow-right"></span></button>
      </div>
      <button class="nav-item settings-link" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Configurações</span></button>
      <div class="sidebar-footer"><div class="user-avatar">EC</div><div class="user-copy"><strong>Meu espaço</strong><span>Conta proprietária</span></div><span class="more-icon" aria-hidden="true">···</span></div>
    </aside>
    <div class="mobile-backdrop" id="mobile-backdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menu"><span data-icon="menu"></span></button>
          <div class="breadcrumb"><span>Portal</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">Visão geral</strong></div>
        </div>
        <div class="topbar-actions">
          <label class="search-box" aria-label="Pesquisar nesta página"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Pesquisar nesta página" autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="drive-status" id="drive-status" data-action="open-settings"><span class="status-indicator"></span><span id="drive-status-label">Drive desconectado</span><span class="status-chevron" data-icon="chevron-down"></span></button>
          <div class="top-user-avatar" title="Conta proprietária">EC</div>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
