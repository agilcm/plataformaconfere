name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  # relê a pasta "Licitacoes - Agil" (área Privado) a cada 3 horas
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Recuperar a última leitura da pasta do Privado
        uses: actions/cache/restore@v4
        with:
          path: |
            privado-cache.json
            public/privado/leitura.json
          key: privado-${{ github.run_id }}
          restore-keys: privado-
      - name: Ler a pasta "Licitacoes - Agil" pelo link compartilhado
        # se o Drive falhar, publica com a última leitura guardada
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/privado-dados.mjs
      - name: Guardar a leitura da pasta
        if: always() && hashFiles('privado-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            privado-cache.json
            public/privado/leitura.json
          key: privado-${{ github.run_id }}
      - run: npm test
      - run: npm run lint
      - name: Compilar para o endereço do Pages
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_STATIC_HOST: 'true'
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
