name: Monitorar pregões

# Consulta o PNCP a cada 5 minutos e avisa pelo Telegram (scripts/monitor-pregoes.mjs).
# Configure em Settings → Secrets and variables → Actions:
#   Variables: MONITOR_PREGOES (um pregão por linha)
#   Secrets:   TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mandar uma mensagem de teste no Telegram'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor-pregoes
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recuperar o que já foi visto
        uses: actions/cache/restore@v4
        with:
          path: monitor-estado.json
          key: monitor-estado-${{ github.run_id }}
          restore-keys: monitor-estado-
      - name: Consultar os pregões
        run: node scripts/monitor-pregoes.mjs ${{ inputs.teste && '--teste' || '' }}
        env:
          MONITOR_PREGOES: ${{ vars.MONITOR_PREGOES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar o que foi visto
        if: always() && hashFiles('monitor-estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: monitor-estado.json
          key: monitor-estado-${{ github.run_id }}
